name: week-jobs

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

concurrency:
  group: week-jobs
  cancel-in-progress: false

jobs:
  generate-weeks:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: socialsync-pro-backend/package-lock.json

      - name: Installer les dépendances du backend
        working-directory: socialsync-pro-backend
        run: npm ci

      - name: Rédiger les semaines en file
        working-directory: socialsync-pro-backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: node scripts/generate-weeks.mjs
