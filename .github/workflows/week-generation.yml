name: week-generation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Rédiger les semaines en file
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Appeler week-jobs jusqu'à épuisement de la file
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Secrets API_URL ou CRON_SECRET manquants dans GitHub."
            exit 1
          fi

          for i in $(seq 1 40); do
            RES=$(curl -sS --max-time 90 -X POST "$API_URL/api/internal/week-jobs" \
              -H "X-Cron-Secret: $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{}') || { echo "::error::Appel impossible à week-jobs."; exit 1; }

            echo "$RES"

            if ! echo "$RES" | jq -e . >/dev/null 2>&1; then
              echo "::error::Réponse non JSON de week-jobs (vérifiez API_URL)."
              exit 1
            fi

            ERRORS=$(echo "$RES" | jq -r '.errors // 1')
            PENDING=$(echo "$RES" | jq -r '.pending // 1')

            if [ "$ERRORS" -gt 0 ]; then
              echo "::error::Erreur de rédaction : $(echo "$RES" | jq -c '.details // .detail // .error')"
              exit 1
            fi

            if [ "$PENDING" -eq 0 ]; then
              echo "File vide, rédaction terminée."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Arrêt de sécurité après 40 appels : la file n'est pas vide."
          exit 1
